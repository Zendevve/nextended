<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nextended — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <header>
      <div class="header-left">
        <span class="logo">⚡</span>
        <h1>nextended Settings</h1>
      </div>
      <span class="tag">Unified Nexus Mods Client</span>
    </header>

    <main>
      <section class="card">
        <h2>Single Downloads & Interception</h2>
        <div class="field-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoStartDownload">
            <div>
              <strong>Auto-start Download</strong>
              <p>Immediately starts downloading when loading a direct download page (?file_id=).</p>
            </div>
          </label>

          <label class="checkbox-label">
            <input type="checkbox" id="autoCloseTab">
            <div>
              <strong>Auto-close Tab</strong>
              <p>Closes tab after auto-start download triggers.</p>
            </div>
          </label>

          <div class="sub-field">
            <label for="closeTabDelayMs">Auto-close delay (ms):</label>
            <input type="number" id="closeTabDelayMs" min="500" step="100" class="num-input">
          </div>

          <label class="checkbox-label">
            <input type="checkbox" id="skipRequirements">
            <div>
              <strong>Skip Requirements PopUp / Tab</strong>
              <p>Bypasses requirements modals and redirects immediately to the download file target.</p>
            </div>
          </label>

          <label class="checkbox-label">
            <input type="checkbox" id="vpnMode">
            <div>
              <strong>VPN & Cloudflare Fallback Mode</strong>
              <p>Redirects the tab directly to the target URL if Cloudflare challenge is encountered.</p>
            </div>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Collections & Batch Downloader</h2>
        <div class="field-group">
          <div class="sub-field">
            <label for="downloadSpeedMb">Calculated Download Speed (MB/s):</label>
            <input type="number" id="downloadSpeedMb" min="0.1" step="0.1" class="num-input">
          </div>

          <div class="sub-field">
            <label for="pauseBetweenDownloadSec">Extra Pause Between Downloads (sec):</label>
            <input type="number" id="pauseBetweenDownloadSec" min="0" step="1" class="num-input">
          </div>

          <label class="checkbox-label">
            <input type="checkbox" id="handleArchivedFiles">
            <div>
              <strong>Unlock Archive Files</strong>
              <p>Injects Mod Manager and Manual download buttons onto archived mod lists.</p>
            </div>
          </label>
        </div>
      </section>

      <div class="footer-actions">
        <button id="resetDefaultsBtn" class="btn btn-secondary">Reset to Defaults</button>
        <button id="saveBtn" class="btn btn-primary">Save Settings</button>
      </div>
      <div id="saveToast" class="save-toast hidden">Settings saved!</div>
    </main>
  </div>
  <script type="module" src="options.ts"></script>
</body>
</html>
