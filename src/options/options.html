<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Download Tools — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>Nexus Mods Download Tools</h1>

    <section>
      <h2>General</h2>
      <label class="switch">
        <input type="checkbox" name="enabled" />
        <span class="slider"></span>
        <span>Enable extension</span>
      </label>

      <label class="switch">
        <input type="checkbox" name="handleCollections" />
        <span class="slider"></span>
        <span>Handle Collection Downloads</span>
      </label>
    </section>

    <section>
      <h2>Automation (No-Wait++)</h2>
      <label class="switch">
        <input type="checkbox" name="autoStartDownload" />
        <span class="slider"></span>
        <span>Auto-Start Download (Skip 5s Countdown)</span>
      </label>

      <label class="switch">
        <input type="checkbox" name="skipRequirements" />
        <span class="slider"></span>
        <span>Skip Requirements Warning / Popup</span>
      </label>

      <label class="switch">
        <input type="checkbox" name="forceModManagerDownload" />
        <span class="slider"></span>
        <span>Inject Mod Manager Buttons on Manual-Only Files</span>
      </label>

      <label class="switch">
        <input type="checkbox" name="handleArchivedFiles" />
        <span class="slider"></span>
        <span>Inject Buttons for Archived Files</span>
      </label>

      <label class="switch">
        <input type="checkbox" name="autoCloseTab" />
        <span class="slider"></span>
        <span>Auto-Close Download Tab After Start</span>
      </label>

      <label>
        Tab close delay (ms)
        <input type="number" name="closeTabDelay" min="0" max="60000" />
      </label>
    </section>

    <section>
      <h2>Collection Downloader</h2>
      <label>
        Pause between downloads (seconds)
        <input type="number" name="collectionPauseBetweenDownload" min="0" max="60" />
      </label>

      <label>
        Download speed (MB/s)
        <input type="number" name="collectionDownloadSpeed" step="0.1" min="0" max="100" />
      </label>

      <span class="group-label">Collection download method</span>
      <label>
        <input type="radio" name="collectionDownloadMethod" value="0" />
        Send to Vortex / MO2
      </label>
      <label>
        <input type="radio" name="collectionDownloadMethod" value="1" />
        Browser Direct Download
      </label>
    </section>

    <section>
      <h2>Advanced</h2>
      <label class="switch">
        <input type="checkbox" name="debugLogging" />
        <span class="slider"></span>
        <span>Enable debug logging</span>
      </label>

      <label>
        Request timeout (ms)
        <input type="number" name="requestTimeout" min="5000" max="120000" />
      </label>
    </section>

    <footer>
      <button id="save-btn" type="button">Save</button>
      <button id="reset-btn" type="button">Reset to defaults</button>
    </footer>
  </main>
  <script src="options/options.js"></script>
</body>
</html>
