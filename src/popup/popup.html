<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Mods Download Tools</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-brand">
        <svg class="header-logo" width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#24282E" stroke="#DA8E35" stroke-width="2"/>
          <path d="M16 8V20M16 20L11 15M16 20L21 15M9 24H23" stroke="#DA8E35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Nexus Download Tools</h1>
      </div>
      <div class="status-indicator" title="Service Worker Status">
        <span id="status-dot" class="dot" aria-label="Service Worker Active"></span>
      </div>
    </header>

    <div class="rows-container">
      <button type="button" id="site-row" class="row" title="Focus active Nexus tab or launch Nexus Mods">
        <div class="row-text">
          <span class="row-label">Current site</span>
          <span class="row-hint">Active Nexus context</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="site-name">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>

      <button type="button" id="queue-row" class="row" title="Open background download queue drawer">
        <div class="row-text">
          <span class="row-label">Background Queue</span>
          <span class="row-hint">Batch downloads & drawer</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="queue-state">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>

      <button type="button" id="collection-row" class="row" title="Focus collection panel or open collections">
        <div class="row-text">
          <span class="row-label">Collection Downloader</span>
          <span class="row-hint">In-page 1-click suite</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="collection-state">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>

      <button type="button" id="nowait-row" class="row" title="Click to toggle automatic 5s countdown skip">
        <div class="row-text">
          <span class="row-label">Countdown Skip</span>
          <span class="row-hint">Instant direct & NXM triggers</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="nowait-state">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>
    </div>

    <section class="meta" aria-label="Statistics">
      <div class="stat-card">
        <span class="stat-label">Collections</span>
        <b id="collections-count" class="stat-value">0</b>
      </div>
      <div class="stat-card">
        <span class="stat-label">Queue Items</span>
        <b id="queue-items-count" class="stat-value">0</b>
      </div>
    </section>

    <footer>
      <button id="open-settings" type="button" title="Open extension configuration options">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Settings</span>
      </button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
