<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Mods Download Tools</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Nexus Download Tools</h1>
      <span id="status-dot" class="dot" aria-hidden="true"></span>
    </header>

    <button type="button" id="site-row" class="row">
      <span class="row-label">Current site</span>
      <span class="row-meta">
        <span class="row-value" id="site-name">—</span>
        <span class="chevron" aria-hidden="true">›</span>
      </span>
    </button>

    <button type="button" id="collection-row" class="row">
      <span class="row-label">Collection Downloader</span>
      <span class="row-meta">
        <span class="row-value" id="collection-state">—</span>
        <span class="chevron" aria-hidden="true">›</span>
      </span>
    </button>

    <button type="button" id="nowait-row" class="row">
      <span class="row-label">Countdown Skip</span>
      <span class="row-meta">
        <span class="row-value" id="nowait-state">—</span>
        <span class="chevron" aria-hidden="true">›</span>
      </span>
    </button>

    <section class="meta">
      <span>Collections downloaded: <b id="collections-count">0</b></span>
    </section>

    <footer>
      <button id="open-settings" type="button">Settings</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
