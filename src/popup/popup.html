<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Mods Download Tools</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-brand">
        <div class="brand-icon-box">
          <svg class="header-logo" width="16" height="16" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M16 4L28 10.5V21.5L16 28L4 21.5V10.5L16 4Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M16 11V21M16 21L11.5 16.5M16 21L20.5 16.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Nexus Download Tools</h1>
      </div>
      <div class="status-indicator" title="Service Worker Status">
        <span id="status-dot" class="dot" aria-label="Service Worker Active"></span>
      </div>
    </header>

    <div class="rows-container">
      <button type="button" id="site-row" class="row" title="Focus active Nexus tab or launch Nexus Mods">
        <div class="row-icon-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <div class="row-text">
          <span class="row-label">Current site</span>
          <span class="row-hint">Active Nexus context</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="site-name">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>

      <button type="button" id="collection-row" class="row" title="Focus collection panel or open collections">
        <div class="row-icon-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div class="row-text">
          <span class="row-label">Collection Downloader</span>
          <span class="row-hint">1-click bulk suite</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="collection-state">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>

      <button type="button" id="nowait-row" class="row" title="Click to toggle automatic 5s countdown skip">
        <div class="row-icon-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="row-text">
          <span class="row-label">Countdown Skip</span>
          <span class="row-hint">Instant direct & NXM</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="nowait-state">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>

      <button type="button" id="archived-row" class="row" title="Click to toggle archived file button restoration">
        <div class="row-icon-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="row-text">
          <span class="row-label">Archived Files</span>
          <span class="row-hint">Restore download buttons</span>
        </div>
        <span class="row-meta">
          <span class="row-value" id="archived-state">—</span>
          <span class="chevron" aria-hidden="true">›</span>
        </span>
      </button>
    </div>

    <section class="meta" aria-label="Statistics">
      <div class="stat-card">
        <span class="stat-label">Collections</span>
        <b id="collections-count" class="stat-value">0</b>
      </div>
      <div class="stat-card">
        <span class="stat-label">Auto-downloads</span>
        <b id="autodl-count" class="stat-value">0</b>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-actions">
        <button id="open-settings" type="button" class="btn-footer" title="Open extension configuration options">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </button>
        <button id="open-donate" class="btn-donate btn-footer" type="button" title="Support developer on Buy Me a Coffee">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
          <span>Buy Me a Coffee</span>
        </button>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
