<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="40%" stop-color="#14161b"/>
      <stop offset="100%" stop-color="#0d0e11"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f3f8"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Squircle Gradients -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282e38"/>
      <stop offset="50%" stop-color="#1a1d22"/>
      <stop offset="100%" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="sqBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2d3748" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="35%" stop-color="#ffb300"/>
      <stop offset="85%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bannerDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bannerBg)"/>
  
  <!-- Subtle Background Grid/Accent Circles -->
  <circle cx="1050" cy="80" r="260" fill="#ff9800" opacity="0.04" filter="url(#subtleGlow)"/>
  <circle cx="200" cy="200" r="180" fill="#ff9800" opacity="0.06" filter="url(#subtleGlow)"/>

  <!-- Logo Icon Container (Left side) -->
  <g transform="translate(100, 60)">
    <!-- Squircle Base (280x280) -->
    <rect width="280" height="280" rx="64" ry="64" fill="url(#sqBg)" filter="url(#bannerDropShadow)"/>
    <rect width="280" height="280" rx="64" ry="64" fill="none" stroke="url(#sqBorder)" stroke-width="4"/>

    <!-- Scaled Emblem inside 280x280 (Original is 512x512) -->
    <g transform="translate(14, 14) scale(0.492)">
      <!-- Left Pillar -->
      <path d="M 148 136 C 148 124 158 114 170 114 L 198 114 C 210 114 220 124 220 136 L 220 286 C 220 298 210 308 198 308 L 170 308 C 158 308 148 298 148 286 Z" fill="url(#accentGrad)" filter="url(#subtleGlow)"/>
      <!-- Right Pillar -->
      <path d="M 292 136 C 292 124 302 114 314 114 L 342 114 C 354 114 364 124 364 136 L 364 286 C 364 298 354 308 342 308 L 314 308 C 302 308 292 298 292 286 Z" fill="url(#accentGrad)" filter="url(#subtleGlow)"/>
      <!-- Arrow -->
      <path d="M 198 134 C 198 123 210 116 220 123 L 256 150 L 292 123 C 302 116 314 123 314 134 L 314 246 L 352 246 C 364 246 370 260 361 269 L 266 371 C 260.5 377 251.5 377 246 371 L 151 269 C 142 260 148 246 160 246 L 198 246 Z" fill="url(#arrowGrad)" filter="url(#subtleGlow)"/>
      <!-- Core Line -->
      <path d="M 256 186 L 256 295 M 226 268 L 256 298 L 286 268" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      <!-- Tray -->
      <path d="M 136 396 C 136 388 142.7 382 150.7 382 L 361.3 382 C 369.3 382 376 388 376 396 C 376 404 369.3 410 361.3 410 L 150.7 410 C 142.7 410 136 404 136 396 Z" fill="url(#accentGrad)"/>
      <path d="M 216 418 L 296 418 C 302 418 306 422 304 428 L 298 434 C 296 436 292 438 288 438 L 224 438 C 220 438 216 436 214 434 L 208 428 C 206 422 210 418 216 418 Z" fill="#ff9800" opacity="0.85"/>
    </g>
  </g>

  <!-- Typography & Information (Right side) -->
  <g transform="translate(430, 110)">
    <!-- Badge Pill -->
    <rect width="186" height="30" rx="15" fill="#2d3748" stroke="#ff9800" stroke-width="1.5" opacity="0.9"/>
    <text x="93" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffb74d" text-anchor="middle" letter-spacing="1.5">MANIFEST V3 SUITE</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Nexus Download Tools
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#a0aec0">
      1-Click Batch Downloads, Auto-Bundler &amp; Queue Engine
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 160)">
      <!-- Tag 1 -->
      <rect width="140" height="32" rx="8" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
      <text x="70" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ No-Wait Skip</text>

      <!-- Tag 2 -->
      <rect x="152" width="165" height="32" rx="8" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
      <text x="234.5" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📦 Collection Sync</text>

      <!-- Tag 3 -->
      <rect x="329" width="175" height="32" rx="8" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
      <text x="416.5" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🧩 Require Bundler</text>

      <!-- Tag 4 -->
      <rect x="516" width="160" height="32" rx="8" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
      <text x="596" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🚀 5x Concurrency</text>
    </g>
  </g>
</svg>
