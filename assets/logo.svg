<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232830"/>
      <stop offset="50%" stop-color="#181b20"/>
      <stop offset="100%" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#2d3748" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Nexus Orange / Amber Flame Gradients -->
    <linearGradient id="nexusGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="40%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="nexusGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="35%" stop-color="#ffb300"/>
      <stop offset="85%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow Behind Central Emblem -->
  <circle cx="256" cy="235" r="130" fill="#ff9800" opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Nexus "N" + Download Arrow Emblem -->
  <g id="emblem" transform="translate(0, -6)">
    <!-- Left Pillar of N -->
    <path d="M 148 136 
             C 148 124 158 114 170 114 
             L 198 114 
             C 210 114 220 124 220 136 
             L 220 286 
             C 220 298 210 308 198 308 
             L 170 308 
             C 158 308 148 298 148 286 
             Z" 
          fill="url(#nexusGrad1)" filter="url(#subtleGlow)"/>

    <!-- Right Pillar of N -->
    <path d="M 292 136 
             C 292 124 302 114 314 114 
             L 342 114 
             C 354 114 364 124 364 136 
             L 364 286 
             C 364 298 354 308 342 308 
             L 314 308 
             C 302 308 292 298 292 286 
             Z" 
          fill="url(#nexusGrad1)" filter="url(#subtleGlow)"/>

    <!-- Dynamic Central Speed Arrow connecting & driving down -->
    <path d="M 198 134 
             C 198 123 210 116 220 123 
             L 256 150 
             L 292 123 
             C 302 116 314 123 314 134 
             L 314 246 
             L 352 246 
             C 364 246 370 260 361 269 
             L 266 371 
             C 260.5 377 251.5 377 246 371 
             L 151 269 
             C 142 260 148 246 160 246 
             L 198 246 
             Z" 
          fill="url(#arrowGrad)" filter="url(#subtleGlow)"/>

    <!-- Central Arrow Accent / Speed Chevron Core -->
    <path d="M 256 186 
             L 256 295 
             M 226 268 
             L 256 298 
             L 286 268" 
          fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Speed Base / Collection Download Tray -->
  <path d="M 136 396 
           C 136 388 142.7 382 150.7 382 
           L 361.3 382 
           C 369.3 382 376 388 376 396 
           C 376 404 369.3 410 361.3 410 
           L 150.7 410 
           C 142.7 410 136 404 136 396 
           Z" 
        fill="url(#trayGrad)" />

  <!-- Speed Tray Center Notch Indicator -->
  <path d="M 216 418 
           L 296 418 
           C 302 418 306 422 304 428 
           L 298 434 
           C 296 436 292 438 288 438 
           L 224 438 
           C 220 438 216 436 214 434 
           L 208 428 
           C 206 422 210 418 216 418 
           Z" 
        fill="#ff9800" opacity="0.85"/>
</svg>
